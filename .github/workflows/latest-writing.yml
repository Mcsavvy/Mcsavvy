name: Latest writing

on:
  schedule:
    - cron: "17 6 * * *" # daily, 07:17 Lagos time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@mcsavvy"
          max_post_count: 4
          template: "- [$title]($url)$newline"
          commit_message: "chore: refresh latest writing"
