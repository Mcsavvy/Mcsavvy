<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="David John, Fractional CTO and Software Architect">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#D6DEEA"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="14" fill="#FAFBFD"/>
  <rect width="1280" height="320" rx="14" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="14" fill="none" stroke="#C9D3E3"/>

  <!-- title block, drafting-sheet style -->
  <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2" fill="#4A5E80">
    <text x="64" y="58">SHEET 01 / PROFILE</text>
    <text x="1216" y="58" text-anchor="end">LAGOS · NG · BUILDING WORLDWIDE</text>
  </g>

  <!-- monogram -->
  <rect x="64" y="104" width="44" height="44" fill="none" stroke="#0F2344" stroke-width="2"/>
  <text x="86" y="132" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#0F2344">DJ</text>

  <!-- name + role -->
  <text x="132" y="146" font-family="'Hanken Grotesk', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5" fill="#0F2344">David John</text>
  <text x="64" y="196" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="3" fill="#7F6124">FRACTIONAL CTO &amp; SOFTWARE ARCHITECT</text>

  <!-- dimension line: idea -> live product -->
  <g stroke="#4A5E80" stroke-width="1.25" fill="none">
    <line x1="64" y1="252" x2="64" y2="272"/>
    <line x1="1216" y1="252" x2="1216" y2="272"/>
    <line x1="64" y1="262" x2="1216" y2="262" stroke-dasharray="2 6"/>
    <path d="M64 262 l10 -5 M64 262 l10 5"/>
    <path d="M1216 262 l-10 -5 M1216 262 l-10 5"/>
  </g>
  <rect x="444" y="250" width="392" height="24" fill="#FAFBFD"/>
  <text x="640" y="267" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.5" fill="#0F2344">“IS THIS POSSIBLE?”  →  SECURE, LIVE PRODUCT</text>
  <circle cx="1216" cy="262" r="4" fill="#7F6124"/>
</svg>
